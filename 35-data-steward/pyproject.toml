[project]
name = "seat35-data-steward"
version = "0.1.0"
description = "AgentSwitch seat 35: duplicate, missing-field and orphan-record reports with merge proposals a person approves"
# The platform's harness runner does not say which Python it uses, so runtime code stays 3.10-compatible.
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Correctness-only linting, as in team04: style and formatting rules are off and no formatter is run.
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "B", "UP"]
ignore = ["E501"]
